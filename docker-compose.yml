# ==============================================================================
# PSIRS Plateau State Revenue Platform — Docker Compose Stack
# ==============================================================================

name: psirs

services:
  # 1. PostgreSQL Database with automated WAL archiving
  postgres:
    image: postgres:16-alpine
    container_name: psirs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: psirs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - psirs_db_data:/var/lib/postgresql/data
      - psirs_backups:/var/backups/psirs
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psirs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PSIRS Backend API Engine
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: psirs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/psirs
      JWT_SECRET: ${JWT_SECRET:-psirs_development_secret_key_minimum_32_characters_long_12345}
      IDENTITY_HASH_SECRET: ${IDENTITY_HASH_SECRET:-psirs_identity_hash_secret_minimum_32_chars_12345}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-psirs_payment_webhook_secret_minimum_32_chars}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - psirs_storage:/app/storage
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Agent Mobile PWA
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: psirs-agent-pwa
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 4. Government Administration Portal
  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: psirs-portal
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 5. Hardened Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: psirs-nginx
    restart: unless-stopped
    depends_on:
      - api
      - agent
      - portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - psirs_certbot_www:/var/www/certbot:ro
      - psirs_certs:/etc/letsencrypt:ro

volumes:
  psirs_db_data:
  psirs_backups:
  psirs_storage:
  psirs_certbot_www:
  psirs_certs:
