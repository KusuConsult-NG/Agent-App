# The whole stack, for a reviewer, an acceptance environment, or a single-node
# deployment.
#
# This is not the production topology — production runs PostgreSQL as a managed
# service with WAL archiving and backups the application host cannot delete
# (docs/DISASTER-RECOVERY.md), behind a load balancer terminating TLS. What this
# does give is one command that stands the platform up exactly as the image will
# run it, which is what makes "it works on my machine" checkable.
#
#   docker compose up --build
#   docker compose run --rm migrate
#   docker compose run --rm backup
#
# Secrets here are development values and the API refuses to start in
# production with any of them, so nothing in this file is a credential.

name: psirs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: psirs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed for psql from the host. Remove for anything shared.
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d psirs']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Migrations run as their own step, not on API boot, because that is the
  # shape production uses: one process applies the schema, then containers
  # start against it. `runMigrations` takes an advisory lock either way.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'apps/api/dist/db/migrate.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/psirs
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/psirs
      RUN_MIGRATIONS_ON_BOOT: 'false'
      # Development values; production refuses to boot with any of them.
      JWT_SECRET: compose-development-jwt-secret-value-32chars
      IDENTITY_HASH_SECRET: compose-development-identity-secret-32chars
      PAYMENT_WEBHOOK_SECRET: compose-development-webhook-secret-32chars
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      VERIFICATION_BASE_URL: http://localhost:5174/verify
      PAYMENT_CALLBACK_URL: http://localhost:5173/payment/return
      LOG_LEVEL: debug
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Runs from the same image as the API so the scripts can never drift from the
  # schema they belong to. `--profile ops` keeps it out of `up`.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['ops']
    entrypoint: ['bash', 'apps/api/scripts/backup.sh']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/psirs
      BACKUP_DIR: /backups
      PGPASSWORD: postgres
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
