# ==============================================================================
# PSIRS Virtual Host, Reverse Proxy & Security Configuration
# ==============================================================================

upstream api_upstream {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream agent_upstream {
    server agent:80;
}

upstream portal_upstream {
    server portal:80;
}

# HTTP -> HTTPS redirect (production)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # For local development or non-SSL environments, proxy directly
    # In production with SSL certificates mounted, uncomment the redirect below:
    # return 301 https://$host$request_uri;

    # Development fallback routing:
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api_upstream/health;
    }

    location /metrics {
        proxy_pass http://api_upstream/metrics;
    }

    # Portal routing (admin & public verification)
    location /portal/ {
        proxy_pass http://portal_upstream/;
        proxy_set_header Host $host;
    }

    # Default root: Agent PWA
    location / {
        proxy_pass http://agent_upstream;
        proxy_set_header Host $host;
    }
}

