name: CI

# The financial guarantees in this platform live in PostgreSQL triggers and
# constraints — a receipt cannot be inserted for an unverified payment, a
# commission cannot exist without verified revenue, financial rows cannot be
# deleted. None of that is observable without a real database, so CI runs the
# suite against one rather than against mocks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psirs_test
        ports:
          - 5432:5432
        # Steps must not start before the server accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/psirs_test
      # Test-only values. Real secrets are never needed to run the suite, and
      # config.ts refuses to boot in production with development integrations,
      # so a leaked CI value grants nothing.
      JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
      IDENTITY_HASH_SECRET: ci-identity-hash-secret-long-enough-32
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-long-enough-32
      STORAGE_PATH: /tmp/psirs-ci-storage

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The suite uses node:test with --test-concurrency, and Node 22 is
          # what the platform is developed and verified against.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        # apps/api resolves @psirs/shared from its build output, so this must
        # precede typecheck and tests.
        run: npm run build --workspace @psirs/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run migrate

      - name: Verify migrations are idempotent and unmodified
        # The runner records a checksum per migration and refuses to continue if
        # an applied file has changed. Re-running proves both that the schema is
        # settled and that no applied migration was edited in place.
        run: npm run migrate

      - name: Seed reference data
        run: npm run seed -- --demo

      - name: Run tests
        # API: unit, full-lifecycle integration, agent scope containment,
        # integration adapters. Agent PWA: the offline capture queue, which runs
        # on a phone with no signal where a silent failure loses a citizen's
        # registration and nobody finds out.
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Start the built artefact
        # The suite runs TypeScript source through tsx; this runs what actually
        # gets deployed. It exists because dist/ could not start at all — tsc
        # compiles TypeScript and nothing else, so the SQL migrations were never
        # copied and the server died at boot on a directory that was not there.
        # Nothing else in the pipeline would have noticed.
        env:
          NODE_ENV: development
          PORT: 4310
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/psirs_smoke
          JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
          IDENTITY_HASH_SECRET: ci-identity-hash-secret-long-enough-32
          PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-long-enough-32
          STORAGE_PATH: /tmp/psirs-ci-smoke-storage
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres psirs_smoke
          node apps/api/dist/server.js > /tmp/smoke.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -m 2 http://127.0.0.1:4310/health > /tmp/health.json; then break; fi
            sleep 1
          done
          echo "--- boot log ---"; cat /tmp/smoke.log
          if ! grep -q '"status":"ok"' /tmp/health.json 2>/dev/null; then
            echo "::error::The built artefact did not start and answer /health."
            exit 1
          fi
          echo "--- health ---"; cat /tmp/health.json
          # A route parameter, so routing is exercised and not just the process.
          curl -sf -m 5 http://127.0.0.1:4310/api/v1/verify/NOSUCHCODE > /dev/null
          pkill -f "node apps/api/dist/server.js" || true

      - name: Check for uncommitted build artefacts
        # Everything generated by a build must be ignored. A dirty tree here
        # means an artefact is tracked, which causes spurious diffs later.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The working tree is dirty after building."
            git status --porcelain
            exit 1
          fi
