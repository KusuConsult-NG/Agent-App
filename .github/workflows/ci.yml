name: CI

# The financial guarantees in this platform live in PostgreSQL triggers and
# constraints — a receipt cannot be inserted for an unverified payment, a
# commission cannot exist without verified revenue, financial rows cannot be
# deleted. None of that is observable without a real database, so CI runs the
# suite against one rather than against mocks.

on:
  push:
    # Every branch, not a named list.
    #
    # This said `[main]`, and this repository's default branch is not `main`.
    # The effect was that a direct push to the branch everything merges into ran
    # no CI at all — only pull requests were ever checked. A large feature
    # commit went in that way and took the suite red (16 failures), and nobody
    # found out, because nothing looked.
    #
    # Listing branches is what created the gap: the list and the actual default
    # branch drifted apart silently. Checking every push cannot drift. A push to
    # a branch that also has an open PR is deduplicated by the concurrency group
    # below, so this does not double the CI bill.
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
#
# Keyed on the branch *name* rather than on `github.ref`, because the two event
# types spell the same branch differently: a push reports `refs/heads/x` while
# its pull request reports `refs/pull/N/merge`. Keyed on `github.ref` the two
# land in different groups, so a branch with an open PR runs the whole suite
# twice for one push. `head_ref` is set only on pull_request events and
# `ref_name` gives the plain branch name on a push, so this expression yields
# "x" for both and the redundant run is cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psirs_test
        ports:
          - 5432:5432
        # Steps must not start before the server accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/psirs_test
      # Test-only values. Real secrets are never needed to run the suite, and
      # config.ts refuses to boot in production with development integrations,
      # so a leaked CI value grants nothing.
      JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
      IDENTITY_HASH_SECRET: ci-identity-hash-secret-long-enough-32
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-long-enough-32
      STORAGE_PATH: /tmp/psirs-ci-storage

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The suite uses node:test with --test-concurrency, and Node 22 is
          # what the platform is developed and verified against.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        # apps/api resolves @psirs/shared from its build output, so this must
        # precede typecheck and tests.
        run: npm run build --workspace @psirs/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Check the Hausa review sheet is not behind the dictionary
        # docs/HAUSA-REVIEW.md is what a native speaker reads before any of
        # this reaches an agent, and its tables are generated. A sheet listing
        # some of the strings is worse than no sheet, because it looks complete
        # to the person reviewing it. This was in `npm run verify` and CI runs
        # the steps individually, so nothing was running it.
        run: npm run check:hausa-review

      - name: Apply migrations
        run: npm run migrate

      - name: Verify migrations are idempotent and unmodified
        # The runner records a checksum per migration and refuses to continue if
        # an applied file has changed. Re-running proves both that the schema is
        # settled and that no applied migration was edited in place.
        run: npm run migrate

      - name: Seed reference data
        run: npm run seed -- --demo

      - name: Run tests
        # API: unit, full-lifecycle integration, agent scope containment,
        # integration adapters. Agent PWA: the offline capture queue.
        # Portal: routing and RBAC permission checks.
        run: npm test

      - name: Verify automated backup and disaster recovery restore
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          PGPASSWORD: postgres
          # The service container's database. Without this the script defaults
          # to "psirs", which does not exist here — the step failed with
          # `FATAL: database "psirs" does not exist` the first time it ever ran.
          DB_NAME: psirs_test
        run: bash deploy/backup/verify-backup.sh

      - name: Build all workspaces
        run: npm run build

      - name: Start the built artefact
        # The suite runs TypeScript source through tsx; this runs what actually
        # gets deployed. It exists because dist/ could not start at all — tsc
        # compiles TypeScript and nothing else, so the SQL migrations were never
        # copied and the server died at boot on a directory that was not there.
        # Nothing else in the pipeline would have noticed.
        env:
          NODE_ENV: development
          PORT: 4310
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/psirs_smoke
          JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
          IDENTITY_HASH_SECRET: ci-identity-hash-secret-long-enough-32
          PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-long-enough-32
          STORAGE_PATH: /tmp/psirs-ci-smoke-storage
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres psirs_smoke || true
          node apps/api/dist/server.js > /tmp/smoke.log 2>&1 &
          # Keep the PID rather than matching on the command line: `pkill -f`
          # also matches the shell running this script, and kills the step.
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf -m 2 http://127.0.0.1:4310/health > /tmp/health.json; then break; fi
            sleep 1
          done
          echo "--- boot log ---"; cat /tmp/smoke.log
          if ! grep -q '"status":"ok"' /tmp/health.json 2>/dev/null; then
            echo "::error::The built artefact did not start and answer /health."
            exit 1
          fi
          echo "--- health ---"; cat /tmp/health.json
          # A route parameter, so routing is exercised and not just the process.
          # Deliberately not `curl -f`: an unknown verification code answers 404,
          # which is the correct answer and not a failure. What is being checked
          # is that the route resolved and the handler ran, so assert the body.
          curl -s -m 5 http://127.0.0.1:4310/api/v1/verify/NOSUCHCODE > /tmp/verify.json
          if ! grep -q 'NOT_FOUND' /tmp/verify.json; then
            echo "::error::A parameterised route did not reach its handler."
            cat /tmp/verify.json
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Check for uncommitted build artefacts
        # Everything generated by a build must be ignored. A dirty tree here
        # means an artefact is tracked, which causes spurious diffs later.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The working tree is dirty after building."
            git status --porcelain
            exit 1
          fi

  # ---------------------------------------------------------------------
  concurrency-tests:
    name: Money path under contention
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Separate from the main suite, and not for speed — these are fourteen
    # seconds of a four-minute run. They are separate because of what they
    # are: assertions about what happens when several confirmations of one
    # payment arrive together, which is the class of test most likely to be
    # disturbed by a loaded runner. Isolated, a wobble here cannot be mistaken
    # for a unit-test regression, and a unit-test regression cannot hide
    # behind one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psirs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/psirs_test
      JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
      IDENTITY_HASH_SECRET: ci-identity-hash-secret-long-enough-32
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-long-enough-32
      STORAGE_PATH: /tmp/psirs-ci-storage

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @psirs/shared

      - name: Apply migrations
        run: npm run migrate

      - name: Seed reference data
        run: npm run seed -- --demo

      - name: Confirmations racing each other
        run: npm run test:concurrency

  # ---------------------------------------------------------------------
  images:
    name: Build every image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Independent of `verify`: a Dockerfile can be broken while the source is
    # perfect, and that is exactly what happened. All three compose images
    # began by copying a tsconfig.json the workspace root does not have, so
    # `docker compose build` aborted on its first instruction for every
    # service — and nothing caught it, because the deploy workflow builds a
    # different Dockerfile and has never run, and CI built no image at all.
    #
    # Nothing is pushed. This asks one question: do they build?

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            name: api-deploy
          - dockerfile: Dockerfile.api
            name: api-compose
          - dockerfile: Dockerfile.agent
            name: agent
          - dockerfile: Dockerfile.portal
            name: portal

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: psirs-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Check the API image can load its own code
        # Building proves the instructions run. This proves the artefact
        # inside is the one the CMD names and that every import resolves —
        # the failure that otherwise waits until a container starts in
        # production.
        #
        # NODE_ENV is overridden because the image sets `production`, and in
        # production `config.js` refuses to load without real secrets and real
        # integrations. That guard is deliberate and tested elsewhere; here it
        # would only ever prove that an image built without credentials has no
        # credentials. What is in question is whether the files are all
        # present and the module graph resolves.
        if: startsWith(matrix.name, 'api')
        run: |
          docker run --rm --entrypoint node \
            -e NODE_ENV=development \
            -e DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
            "psirs-${{ matrix.name }}:ci" \
            -e "require('/app/apps/api/dist/app.js'); console.log('image loads')"
