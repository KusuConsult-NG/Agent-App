name: Deploy

# Deployment for a platform that moves government revenue, so the ordering is
# the point rather than the mechanics:
#
#   1. the full suite must pass — the financial guarantees are database
#      triggers, so this runs against a real PostgreSQL, not mocks;
#   2. the image is built and pushed, tagged by commit so a rollback names an
#      exact artefact rather than "the last one";
#   3. a backup is taken BEFORE migrations touch the schema, because a
#      migration is the most likely thing to need reverting and the point of
#      having backups is the moment you need one;
#   4. migrations run once, as their own job, not on container boot;
#   5. the new image is rolled out and its health confirmed;
#   6. a failed rollout redeploys the previous tag automatically.
#
# Everything after `build` needs credentials and a target that this repository
# does not own, so those jobs are gated on the `production` environment. Wiring
# them to real infrastructure is the remaining deployment task described in
# docs/DEPLOYMENT.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Image tag to roll back to (leave empty for a normal deploy)'
        required: false
        type: string

concurrency:
  # Never two deployments at once: the second would migrate underneath the
  # first. Not cancel-in-progress — a half-finished deploy must be allowed to
  # finish rather than be abandoned mid-rollout.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  # ---------------------------------------------------------------------
  verify:
    name: Test against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.inputs.rollback_to == ''

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psirs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/psirs_test
      JWT_SECRET: ci-jwt-secret-value-that-is-long-enough-32
      IDENTITY_HASH_SECRET: ci-identity-hash-secret-long-enough-32
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-long-enough-32
      STORAGE_PATH: /tmp/psirs-ci-storage

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @psirs/shared
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - name: Agent PWA tests
        run: npm run test --workspace @psirs/agent

  # ---------------------------------------------------------------------
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    needs: [verify]
    timeout-minutes: 20
    if: github.event.inputs.rollback_to == ''
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - id: meta
        # The commit SHA, always. A rollback has to name an exact artefact, and
        # "latest" cannot do that.
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image before anyone deploys it
        # The suite runs the TypeScript source through tsx; this is the only
        # thing that checks the artefact people actually deploy can start.
        #
        # NODE_ENV is overridden because the image sets `production`, where
        # `config.js` refuses to load without real secrets and real
        # integrations. Without this the step fails on every deploy — it never
        # had the chance to, because this workflow has never run.
        run: |
          docker run --rm --entrypoint node \
            -e NODE_ENV=development \
            -e DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} \
            -e "require('/app/apps/api/dist/app.js'); console.log('image loads')"

  # ---------------------------------------------------------------------
  backup:
    name: Back up before migrating
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Take a verified backup
        # A migration is the most likely change to need reverting, and a
        # backup taken after it is no use for that.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: ${{ runner.temp }}/backups
          BACKUP_UPLOAD: s3
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
        run: bash apps/api/scripts/backup.sh

  # ---------------------------------------------------------------------
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    needs: [build, backup]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Run migrations from the image being deployed
        # From the image, so the migrations applied are byte-identical to the
        # ones the new containers will verify their checksums against.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL -e NODE_ENV=production \
            ${{ env.IMAGE }}:${{ needs.build.outputs.tag }} \
            node apps/api/dist/db/migrate.js

  # ---------------------------------------------------------------------
  deploy:
    name: Roll out
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Record what is running now, so a rollback has a target
        id: current
        run: |
          echo "previous=$(
            ${{ secrets.DEPLOY_DESCRIBE_COMMAND }} || echo ''
          )" >> "$GITHUB_OUTPUT"

      - name: Deploy the new image
        # One command, whatever the target is — ECS, Kubernetes, Nomad or a
        # systemd unit over SSH. It receives the image reference and is
        # expected to wait for the rollout to settle.
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
        run: ${{ secrets.DEPLOY_COMMAND }}

      - name: Confirm the deployment is actually serving
        # Readiness, not liveness: the question is whether it can reach the
        # database and answer, not whether the process exists.
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${{ secrets.HEALTH_URL }}" > /tmp/health.json; then
              echo "healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt ${attempt}: not ready yet"
            sleep 10
          done
          echo "deployment did not become healthy within 5 minutes" >&2
          exit 1

      - name: Roll back if the rollout did not come up
        if: failure() && steps.current.outputs.previous != ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.current.outputs.previous }}
        run: |
          echo "::error::Rollout failed health checks. Reverting to ${IMAGE_REF}."
          # Note: this reverts the application, not the schema. Migrations are
          # written to be backward compatible with the previous release for
          # exactly this reason — see docs/DEPLOYMENT.md.
          ${{ secrets.DEPLOY_COMMAND }}

  # ---------------------------------------------------------------------
  manual_rollback:
    name: Manual rollback
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.rollback_to != ''
    timeout-minutes: 15
    steps:
      - name: Redeploy a named tag
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.event.inputs.rollback_to }}
        run: ${{ secrets.DEPLOY_COMMAND }}

      - name: Confirm it is serving
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 10 "${{ secrets.HEALTH_URL }}" && exit 0
            sleep 10
          done
          exit 1
